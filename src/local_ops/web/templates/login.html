{% extends "base.html" %}{% block title %}Login{% endblock %}
{% block content %}
<h1>Reviewer login</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/login" class="card narrow">
  <input type="hidden" name="next" value="{{ next }}">
  <label>Username <input name="username" autocomplete="username" required></label>
  <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
  <button type="submit">Log in</button>
  <p class="muted">Agent API keys cannot log in here. Set a reviewer password with <code>local-ops reviewer set-password</code>.</p>
</form>
{% endblock %}
