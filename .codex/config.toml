# Codex project configuration for local-ops-mcp.
# MCP servers: one per capability (read, write). Keys live in local-config/keys.env (0600, gitignored); export them before
# starting Codex, e.g. `set -a; . ./local-config/keys.env; set +a`.

[mcp_servers.local-ops-read]
url = "http://127.0.0.1:8765/mcp/read/"
bearer_token_env_var = "LOCAL_OPS_KEY_READ_DEFAULT"
enabled = true
required = false
startup_timeout_sec = 20
tool_timeout_sec = 600

[mcp_servers.local-ops-write]
url = "http://127.0.0.1:8765/mcp/write/"
bearer_token_env_var = "LOCAL_OPS_KEY_WRITE_DEFAULT"
enabled = false   # enable deliberately when a session needs write (execution) access
required = false
startup_timeout_sec = 20
tool_timeout_sec = 1200
