[project]
name = "local-ops-mcp"
version = "0.1.0"
description = "Local Operations MCP: discovery, diagnosis and controlled execution for a small production estate, reviewed in a local browser."
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
dependencies = [
  "mcp>=2.2,<3",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.12",
  "aiobotocore>=3.0",
  "kubernetes_asyncio>=32",
  "onepassword-sdk>=0.3",
  "aiosqlite>=0.21",
  "httpx>=0.28",
  "jinja2>=3.1",
  "pyyaml>=6",
  "argon2-cffi>=23",
  "itsdangerous>=2.2",
  "python-multipart>=0.0.20",
  "typer>=0.15",
]

[project.scripts]
local-ops = "local_ops.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "mypy>=1.13",
  "playwright>=1.49",
  "pytest-playwright>=0.6",
  "types-PyYAML",
  "respx>=0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_ops"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "browser: Playwright browser tests for the review site",
  "integration: opt-in tests that require the disposable local kind cluster (LOCAL_OPS_INTEGRATION=1)",
]
filterwarnings = ["ignore::DeprecationWarning:mcp.*"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "T20"]
ignore = ["B008", "E501"]
per-file-ignores = {"tests/*" = ["T20"], "scripts/*" = ["T20"], "demo/*" = ["T20"], "src/local_ops/cli.py" = ["T20"]}

[tool.mypy]
python_version = "3.12"
packages = ["local_ops"]
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
no_implicit_optional = true
