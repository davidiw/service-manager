# Values for the demo-helm chart (disposable local-ops kind cluster only).
replicaCount: 1

image:
  repository: localhost:5001/local-ops/demo-app
  # Full image reference including digest (repo@sha256:...). When set it overrides repository:tag.
  # The local-ops helm executor pins this with: --set-string image.ref=<repo@sha256:...>
  ref: ""
  tag: v1
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 8080
  nodePort: 30081

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi
