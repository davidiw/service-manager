# Post-upgrade hook: exercises hook disclosure in the local-ops helm executor plan.
# It only reads /version from the upgraded service and never fails the release.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-post-upgrade-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: demo-helm
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-helm-hook
    spec:
      restartPolicy: Never
      containers:
        - name: check-version
          image: busybox:1.36
          command: ["sh", "-c", "wget -qO- http://{{ .Release.Name }}:{{ .Values.service.port }}/version || true"]
